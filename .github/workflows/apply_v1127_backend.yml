name: Apply OkeyX V11.0.27 backend

on:
  push:
    branches:
      - sync-v1127-final4
    paths:
      - .github/workflows/apply_v1127_backend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and test backend
        shell: bash
        run: |
          set -euo pipefail
          cat .okeyx_sync/changed_*.b64 | tr -d '\r\n ' > /tmp/v1127.b64
          base64 -d /tmp/v1127.b64 > /tmp/v1127.tar.xz
          tar -xJf /tmp/v1127.tar.xz
          python -m compileall -q backend/app
          python -m pip install -r backend/requirements.txt
          pytest -q backend/tests

      - name: Commit tested backend
        shell: bash
        run: |
          git config user.name "OkeyX Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .okeyx_sync
          rm -f .github/workflows/apply_v1127_backend.yml
          git add -A backend .okeyx_sync .github/workflows/apply_v1127_backend.yml
          git commit -m "Ship V11.0.27 full multiplayer quality backend"
          git push origin HEAD:sync-v1127-final4
