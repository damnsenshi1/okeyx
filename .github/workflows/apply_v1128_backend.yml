name: Apply OkeyX V11.0.28 backend

on:
  push:
    branches: [sync-v1128-final]
    paths:
      - .github/workflows/apply_v1128_backend.yml

permissions:
  contents: write

jobs:
  apply-test-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact V11.0.28 backend source
        shell: bash
        run: |
          set -euo pipefail
          materialize() {
            src=".okeyx_sync/$1"
            dst="$2"
            test -f "$src"
            mkdir -p "$(dirname "$dst")"
            base64 -d "$src" | xz -d > "$dst"
          }
          materialize account.py.xz.b64 backend/app/api/account.py
          materialize game.py.xz.b64 backend/app/api/game.py
          materialize phase4.py.xz.b64 backend/app/api/phase4.py
          materialize account_store.py.xz.b64 backend/app/services/account_store.py
          materialize phase4_service.py.xz.b64 backend/app/services/phase4_service.py
          materialize test_v1128_product_pass.py.xz.b64 backend/tests/test_v1128_product_pass.py
      - name: Test backend
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/app
          python -m pip install -q -r backend/requirements.txt
          PYTHONPATH=backend pytest -q backend/tests
      - name: Ship tested backend to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OkeyX Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .okeyx_sync
          rm -f .github/workflows/apply_v1128_backend.yml
          find backend -type d -name __pycache__ -prune -exec rm -rf {} + || true
          rm -rf backend/.pytest_cache .pytest_cache
          git add -A backend .okeyx_sync .github/workflows/apply_v1128_backend.yml
          git commit -m "Ship V11.0.28 full product backend"
          git push origin HEAD:main
