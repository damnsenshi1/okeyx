name: Apply OkeyX V11.0.28 backend

on:
  push:
    branches: [sync-v1128-final]
    paths:
      - .github/workflows/apply_v1128_backend.yml

permissions:
  contents: write

jobs:
  apply-test-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize exact V11.0.28 backend source
        shell: bash
        run: |
          set -euo pipefail
          # All five verified text chunks must be present before decoding.
          for i in 00 01 02 03 04; do test -f ".okeyx_sync/v1128_valid_${i}.b64"; done
          cat .okeyx_sync/v1128_valid_00.b64 .okeyx_sync/v1128_valid_01.b64 .okeyx_sync/v1128_valid_02.b64 .okeyx_sync/v1128_valid_03.b64 .okeyx_sync/v1128_valid_04.b64 > /tmp/v1128.b64
          base64 -d /tmp/v1128.b64 > /tmp/v1128_backend.tar.xz
          xz -t /tmp/v1128_backend.tar.xz
          tar -xJf /tmp/v1128_backend.tar.xz -C .
          test -f backend/app/api/game.py
          test -f backend/app/services/account_store.py
          test -f backend/tests/test_v1128_product_pass.py
      - name: Test backend
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/app
          python -m pip install -q -r backend/requirements.txt
          PYTHONPATH=backend pytest -q backend/tests
      - name: Ship tested backend to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OkeyX Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .okeyx_sync .sync1128
          rm -f .github/workflows/apply_v1128_backend.yml
          find backend -type d -name __pycache__ -prune -exec rm -rf {} + || true
          rm -rf backend/.pytest_cache .pytest_cache
          git add -A backend .okeyx_sync .sync1128 .github/workflows/apply_v1128_backend.yml
          git commit -m "Ship V11.0.28 full product backend"
          git push origin HEAD:main
