name: OKEYX backend kur (zip -> backend/)

on:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/backend_kur.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i bul ve ac
        id: zip
        run: |
          ZIP=$(ls -1 okeyx_backend_yukle*.zip 2>/dev/null | tail -n 1 || true)
          if [ -z "$ZIP" ]; then echo "Zip yok, yapilacak is yok."; echo "found=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "Kullanilan zip: $ZIP"
          rm -rf /tmp/nb && mkdir -p /tmp/nb && unzip -q "$ZIP" -d /tmp/nb
          test -f /tmp/nb/app/main.py || { echo "HATA: zip icinde app/main.py yok"; exit 1; }
          echo "found=yes" >> "$GITHUB_OUTPUT"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Testleri calistir
        if: steps.zip.outputs.found == 'yes'
        run: |
          cd /tmp/nb
          python -m pip install -q -r requirements.txt pytest
          python -m pytest -q -p no:cacheprovider

      - name: backend/ klasorunu degistir, daginik dosyalari temizle
        if: steps.zip.outputs.found == 'yes'
        run: |
          rm -rf /tmp/nb/data
          find /tmp/nb -name __pycache__ -prune -exec rm -rf {} +
          git rm -r -q --cached backend
          rm -rf backend && mkdir backend && cp -a /tmp/nb/. backend/
          # Web yuklemesinde ana dizine dagilan dosyalari sil (klasorlere dokunmaz)
          for f in * .[!.]*; do
            [ -f "$f" ] || continue
            case "$f" in
              Dockerfile|render.yaml|.dockerignore|.gitignore|README*|LICENSE*) ;;
              *) git rm -q -f --ignore-unmatch -- "$f" || true; rm -f -- "$f" ;;
            esac
          done
          # Render bu Dockerfile ile kurar: kodu backend/ icinden alir
          cat > Dockerfile <<'DOCKER'
          FROM python:3.12-slim
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PORT=10000
          WORKDIR /app
          COPY backend/requirements.txt ./requirements.txt
          RUN pip install --no-cache-dir -r requirements.txt
          COPY backend/app ./app
          RUN mkdir -p /app/data
          EXPOSE 10000
          CMD ["sh","-c","exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"]
          DOCKER
          sed -i 's/^          //' Dockerfile

      - name: Kaydet ve gonder
        if: steps.zip.outputs.found == 'yes'
        run: |
          git config user.name "OkeyX Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Backend V12.1 kuruldu (testler gecti)" || { echo "Degisiklik yok"; exit 0; }
          git push
