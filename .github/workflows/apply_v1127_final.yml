name: Apply OkeyX V11.0.27 final backend

on:
  push:
    branches: [main]
    paths:
      - tools/apply_v1127_final.py
      - .github/workflows/apply_v1127_final.yml

permissions:
  contents: write

jobs:
  patch-test-ship:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply backend patch
        run: python tools/apply_v1127_final.py
      - name: Test backend
        run: |
          python -m compileall -q backend/app
          python -m pip install -q -r backend/requirements.txt
          PYTHONPATH=backend pytest -q backend/tests
      - name: Commit tested backend
        run: |
          git config user.name "OkeyX Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          rm -f tools/apply_v1127_final.py .github/workflows/apply_v1127_final.yml
          find backend -type d -name __pycache__ -prune -exec rm -rf {} + || true
          rm -rf backend/.pytest_cache .pytest_cache
          git add -A backend tools .github/workflows/apply_v1127_final.yml
          git commit -m "Ship V11.0.27 ready rooms and free social effects"
          git push origin HEAD:main
