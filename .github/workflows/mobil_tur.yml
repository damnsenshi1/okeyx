name: OKEYX mobil kur + APK + gerÃ§ek ekran turu

# KullanÄ±m: depo ana dizinine okeyx_mobil_yukle*.zip yÃ¼kle (Add file â†’ Upload files).
# Bu iÅŸ akÄ±ÅŸÄ±:
#   1) zip'i mobile/ klasÃ¶rÃ¼ne aÃ§ar ve depoya kaydeder,
#   2) flutter analyze Ã§alÄ±ÅŸtÄ±rÄ±r, APK derler,
#   3) APK'yÄ± Android emÃ¼latÃ¶rÃ¼nde aÃ§Ä±p gerÃ§ek ekran turu Ã§eker (misafir giriÅŸ â†’
#      ana sayfa â†’ Masalar â†’ Masa kur â†’ HÄ±zlÄ± oyna â†’ oyun masasÄ±).
# SonuÃ§lar: Actions â†’ bu Ã§alÄ±ÅŸtÄ±rma â†’ Artifacts:
#   okeyx-apk         : telefona kurulabilir APK
#   okeyx-ekran-turu  : okeyx_gercek_tur.mp4, okeyx_ekranlar.mp4, ekran/*.png, hatalar.txt
on:
  push:
    branches: [main]
    paths:
      - 'okeyx_mobil_yukle*.zip'
      - 'mobile/**'
      - '.github/workflows/mobil_tur.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mobil:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Zip'i mobile/ klasÃ¶rÃ¼ne aÃ§
        run: |
          ZIP=$(ls -1 okeyx_mobil_yukle*.zip 2>/dev/null | tail -n 1 || true)
          if [ -z "$ZIP" ]; then
            echo "Zip yok; depodaki mobile/ kullanÄ±lacak."
            test -f mobile/pubspec.yaml || { echo "HATA: ne zip ne mobile/ var"; exit 1; }
            exit 0
          fi
          echo "KullanÄ±lan zip: $ZIP"
          rm -rf /tmp/mb && mkdir -p /tmp/mb && unzip -q "$ZIP" -d /tmp/mb
          SRC=/tmp/mb; [ -f /tmp/mb/pubspec.yaml ] || SRC=$(dirname "$(find /tmp/mb -maxdepth 3 -name pubspec.yaml | head -n 1)")
          test -f "$SRC/pubspec.yaml" || { echo "HATA: zip iÃ§inde pubspec.yaml yok"; exit 1; }
          git rm -r -q --cached mobile 2>/dev/null || true
          rm -rf mobile && mkdir mobile && cp -a "$SRC/." mobile/
          git rm -q -f --ignore-unmatch okeyx_mobil_yukle*.zip; rm -f okeyx_mobil_yukle*.zip
          git config user.name "OkeyX Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A mobile
          git commit -q -m "Mobil V18 kuruldu" || echo "DeÄŸiÅŸiklik yok"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done || echo "UYARI: push yapÄ±lamadÄ±, derleme yine de devam ediyor"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Paketler ve analiz
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../tour_out
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee ../tour_out/analiz.txt

      - name: Testler
        working-directory: mobile
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee ../tour_out/testler.txt
          # GÃ¶rsel kontrol: Ä±staka kaplamalarÄ±nÄ±n ekran gÃ¶rÃ¼ntÃ¼sÃ¼
          OKEYX_GOLDENS=1 flutter test test/rack_golden_test.dart --update-goldens 2>&1 | tail -20 | tee -a ../tour_out/testler.txt || true
          mkdir -p ../tour_out/gorsel && cp -f test/goldens/*.png ../tour_out/gorsel/ 2>/dev/null || true

      - name: YayÄ±n imza anahtarÄ±nÄ± hazÄ±rla
        working-directory: mobile
        shell: bash
        env:
          KS_B64: ${{ secrets.OKEYX_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.OKEYX_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "UYARI: imza anahtarÄ± secret'larÄ± yok; APK debug anahtarla imzalanÄ±r ve GitHub sÃ¼rÃ¼mÃ¼ yayÄ±nlanmaz."
            echo "SIGNED=0" >> "$GITHUB_ENV"; exit 0
          fi
          echo "$KS_B64" | base64 -d > android/okeyx_release.p12
          printf 'storeFile=okeyx_release.p12\nstorePassword=%s\nkeyAlias=okeyx\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > android/key.properties
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: APK derle
        working-directory: mobile
        shell: bash
        run: |
          mkdir -p ../tour_out
          flutter pub get >/dev/null
          # Maven Central ara sÄ±ra 429 (Ã§ok istek) dÃ¶nebiliyor: bekleyip yeniden dene.
          set -o pipefail
          for i in 1 2 3 4; do
            BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//'); VNAME=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
            flutter build apk --release --dart-define-from-file=app_config.json --dart-define=OKEYX_BUILD=$BUILD --dart-define=OKEYX_VERSION=$VNAME 2>&1 | tee ../tour_out/derleme.txt && exit 0
            echo "Derleme denemesi $i baÅŸarÄ±sÄ±z, $((i*60)) sn sonra tekrar"; sleep $((i*60))
          done
          exit 1 2>&1 | tee ../tour_out/derleme.txt

      - name: Derleme kayÄ±tlarÄ±nÄ± sakla (hata olursa da)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: okeyx-derleme-kayitlari
          path: tour_out/

      - uses: actions/upload-artifact@v4
        with:
          name: okeyx-apk
          path: mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: KVM aÃ§ (emÃ¼latÃ¶r hÄ±zÄ± iÃ§in)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: EmÃ¼latÃ¶rde gerÃ§ek ekran turu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swangle_indirect -no-snapshot -noaudio -no-boot-anim
          script: adb install -r mobile/build/app/outputs/flutter-apk/app-release.apk && OUT=$GITHUB_WORKSPACE/tour_out bash mobile/tool/screen_tour.sh

      - name: VideolarÄ± hazÄ±rla
        if: always()
        continue-on-error: true
        run: |
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null) || true
          cd tour_out || exit 0
          : > liste.txt
          for f in tur_1.mp4 tur_2.mp4; do [ -s "$f" ] && echo "file '$f'" >> liste.txt; done
          if [ -s liste.txt ]; then
            ffmpeg -loglevel error -y -f concat -safe 0 -i liste.txt -vf "scale=1280:-2,fps=30" -c:v libx264 -crf 23 -preset veryfast -pix_fmt yuv420p okeyx_gercek_tur.mp4 || true
          fi
          if ls ekran/*.png >/dev/null 2>&1; then
            ffmpeg -loglevel error -y -framerate 1/2.5 -pattern_type glob -i 'ekran/*.png' -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p" -c:v libx264 -crf 20 -preset veryfast okeyx_ekranlar.mp4 || true
          fi
          rm -f liste.txt tur_1.mp4 tur_2.mp4 .rec.pid .logcat.pid
          ls -la

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: okeyx-ekran-turu
          path: tour_out/
          retention-days: 14

      - name: SonuÃ§larÄ± tur-sonuclari dalÄ±na gÃ¶nder (indirmesi kolay olsun)
        if: always()
        run: |
          mkdir -p /tmp/sonuc && cp -a tour_out/. /tmp/sonuc/ 2>/dev/null || true
          # GitHub 100 MB dosya sÄ±nÄ±rÄ±: APK'yÄ± 45 MB parÃ§alara bÃ¶l (cat ile birleÅŸir).
          if [ -f mobile/build/app/outputs/flutter-apk/app-release.apk ]; then
            mkdir -p /tmp/sonuc/apk
            split -b 45m -d mobile/build/app/outputs/flutter-apk/app-release.apk /tmp/sonuc/apk/okeyx_v18_telefon.apk.part
            sha256sum mobile/build/app/outputs/flutter-apk/app-release.apk > /tmp/sonuc/apk/sha256.txt
          fi
          rm -f /tmp/sonuc/logcat.txt
          find /tmp/sonuc -name '*.mp4' -size +45M -delete
          cd /tmp/sonuc
          git init -q -b tur-sonuclari
          git config user.name "OkeyX Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          echo "Ã‡alÄ±ÅŸtÄ±rma: ${{ github.run_id }} â€¢ commit ${{ github.sha }}" > README.md
          git add -A && git commit -q -m "Ekran turu ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref == 'refs/heads/main' && 'tur-sonuclari' || 'onizleme-sonuclari' }}

      - name: GitHub sÃ¼rÃ¼mÃ¼ yayÄ±nla (uygulama iÃ§i gÃ¼ncelleme bunu okur)
        if: success() && env.SIGNED == '1' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^version:' mobile/pubspec.yaml | awk '{print $2}')
          NAME=${VER%%+*}; BUILD=${VER##*+}
          TAG="v${NAME}-b${BUILD}"
          # AynÄ± anda biten eski bir derleme yeni sÃ¼rÃ¼mÃ¼n Ã¶nÃ¼ne geÃ§mesin.
          LATEST=$(gh release view -R "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null | sed -n 's/.*-b\([0-9]*\)$/\1/p')
          if [ -n "$LATEST" ] && [ "$BUILD" -lt "$LATEST" ]; then echo "Daha yeni sÃ¼rÃ¼m (b$LATEST) zaten yayÄ±nda; atlanÄ±yor."; exit 0; fi
          cp mobile/build/app/outputs/flutter-apk/app-release.apk okeyx.apk
          NOTES=mobile/RELEASE_NOTES.md; [ -f "$NOTES" ] || { echo "Yeni sÃ¼rÃ¼m" > /tmp/notes.md; NOTES=/tmp/notes.md; }
          if gh release view "$TAG" -R "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" okeyx.apk --clobber -R "${{ github.repository }}"
            gh release edit "$TAG" --notes-file "$NOTES" --latest -R "${{ github.repository }}"
          else
            gh release create "$TAG" okeyx.apk --title "OKEYX $NAME (build $BUILD)" --notes-file "$NOTES" --latest --target "${{ github.sha }}" -R "${{ github.repository }}"
          fi

