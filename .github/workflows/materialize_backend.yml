name: Materialize OkeyX backend source

on:
  push:
    paths:
      - .github/workflows/materialize_backend.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize verified backend source
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f deploy/render_backend_00.b64 ]; then
            echo "Direct-source backend already materialized"
            exit 0
          fi
          for f in deploy/render_backend_*.b64; do
            echo "$(basename "$f") bytes=$(wc -c < "$f") blob=$(git hash-object "$f")"
          done
          cat deploy/render_backend_*.b64 | tr -d '\r\n ' > /tmp/backend.b64
          base64 -d /tmp/backend.b64 > /tmp/backend.tar.xz
          echo "569ee854dc4b130e3698b85afac79bbd66a19d7ebf31e1288a283ff5e6b356ca  /tmp/backend.tar.xz" | sha256sum -c -
          rm -rf backend
          mkdir -p backend
          tar -xJf /tmp/backend.tar.xz -C backend
          test -f backend/app/main.py
          test -f backend/app/api/game.py
          test -f backend/app/services/game_runtime.py
          test -f backend/requirements.txt
      - name: Switch Docker to direct source
        shell: bash
        run: |
          if [ ! -f backend/app/main.py ]; then exit 0; fi
          cat > Dockerfile <<'DOCKERFILE'
          FROM python:3.12-slim
          ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 PORT=10000
          WORKDIR /app
          COPY backend/requirements.txt ./requirements.txt
          RUN pip install --no-cache-dir -r requirements.txt
          COPY backend/app ./app
          RUN mkdir -p /app/data
          EXPOSE 10000
          CMD ["sh","-c","exec uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"]
          DOCKERFILE
          sed -i 's/^          //' Dockerfile
          rm -rf deploy
      - name: Commit direct-source backend
        shell: bash
        run: |
          git config user.name "OkeyX Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A backend Dockerfile deploy
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Materialize direct-source Render multiplayer backend"
          git push origin HEAD:main
