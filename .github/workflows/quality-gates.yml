name: OKEYX quality gates

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - codex/okeyx-finalization

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q

  mobile:
    name: Flutter analysis and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test --reporter expanded
      - name: Prepare Android signing key when configured
        working-directory: mobile
        env:
          KS_B64: ${{ secrets.OKEYX_KEYSTORE_B64 }}
          KS_PW: ${{ secrets.OKEYX_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "No release keystore configured; building a debug-signed release-mode validation APK."
            exit 0
          fi
          echo "$KS_B64" | base64 -d > android/okeyx_release.p12
          printf 'storeFile=okeyx_release.p12\nstorePassword=%s\nkeyAlias=okeyx\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > android/key.properties
      - name: Build Android release APK
        working-directory: mobile
        shell: bash
        run: |
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | sed 's/+.*//')
          flutter build apk --release --dart-define-from-file=app_config.json --dart-define=OKEYX_BUILD="$BUILD" --dart-define=OKEYX_VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: okeyx-android-release-${{ github.sha }}
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
