name: OKEYX hazır sesli mesaj üret
on:
  push:
    branches: [main]
    paths: ['tools/voices/**', '.github/workflows/ses_uret.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ses:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Piper ve ffmpeg
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q piper-tts==1.2.0
      - name: Sesleri üret
        working-directory: tools/voices
        run: python make.py lines.txt
      - name: ses-uretim dalına gönder
        run: |
          cd tools/voices/out
          git init -q -b ses-uretim
          git config user.name "OkeyX Deploy Bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -q -m "Sesler ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ses-uretim
