name: okeyx_mobile
description: OkeyX mobile-only 101 Okey client
publish_to: none
version: 20.3.0+230
environment:
  sdk: '>=3.10.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.9.1
  url_launcher: 6.3.2
  google_sign_in: 6.2.2
  shared_preferences: 2.5.5
  audioplayers: 6.2.0
  just_audio: ^0.9.46
  in_app_purchase: 3.3.0
  google_mobile_ads: 9.1.0
  image_picker: 1.1.2
  image_cropper: 12.2.1
  flutter_webrtc: 1.6.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/sfx/
    - assets/brand/
    - assets/textures/
    - assets/rack/
    - assets/tiles/
    - assets/table/
    - assets/ui/
    - assets/music/
  fonts:
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lora-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
    - family: ArchivoBlack
      fonts:
        - asset: assets/fonts/ArchivoBlack-Regular.ttf
