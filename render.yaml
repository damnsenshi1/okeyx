services:
  - type: web
    name: okeyx-mp
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    # Yalnızca sunucu kodu değişince yeniden yükle: mobil/APK değişiklikleri
    # canlı masaları yeniden başlatıp oyuncuları masadan atmasın.
    buildFilter:
      paths:
        - backend/**
        - Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: ENV
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: RUNTIME_SNAPSHOT_PATH
        value: /app/data/active_rooms.bin
      - key: RUNTIME_SECRET
        generateValue: true
      - key: ADMIN_KEY
        generateValue: true
      - key: ALLOW_TEST_BILLING
        value: "false"
      - key: SUPABASE_URL
        value: https://ofajtgacffxfdaylcgex.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_7DI7vp9jfRBprYG-4rmdJw_bp6lq2s8
      - key: SUPABASE_JWT_AUDIENCE
        value: authenticated
